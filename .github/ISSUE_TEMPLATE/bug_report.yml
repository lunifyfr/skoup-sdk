name: Bug report
description: Something the library does wrong — a hit not sent, a page not counted, a type that does not compile.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@skoup/analytics (core / tag)'
        - '@skoup/analytics-react'
        - '@skoup/analytics-next'
        - '@skoup/analytics-vue'
        - '@skoup/analytics-nuxt'
        - '@skoup/analytics-svelte'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead. A request/response of `POST /t` from the network tab helps (never paste your site key's private data — the key itself is public).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A snippet, a StackBlitz, or the steps. The framework and its version, the browser.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "The tag or the provider is loaded once, after the visitors' consent (or with consent: 'wait')."
        - label: The site key belongs to the brand and the page's host is one of its allowed hosts.
