name: Publish
# Publishes every package to npm at the version of its package.json when a
# `v*` tag is pushed (`NPM_TOKEN` secret, automation token of the @skoup org).
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      # The core goes first: the wrappers depend on its published version.
      - run: |
          for pkg in analytics analytics-react analytics-vue analytics-next analytics-nuxt analytics-svelte; do
            (cd "packages/$pkg" && npm publish --access public --provenance)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
